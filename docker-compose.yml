services:
  backend:
    build: ./
    container_name: wms_container
    working_dir: /wms/src
    ports:
      - "8010"
    command: /wms/commands/start_server_prod.sh
    volumes:
      - ./src:/wms/src
      - ./commands:/wms/commands
      - staticfiles_content:/wms/src/staticfiles
      - media_content:/wms/src/media
    env_file:
      - .env

#  postgres:
#    image: postgres:17.5
#    ports:
#      - "5433:5432"
#    volumes:
#      - pg_data:/var/lib/postgresql/data
#    env_file:
#      - .env
#
#  pgadmin:
#    image: dpage/pgadmin4
#    container_name: pgadmin_container
#    restart: on-failure
#    env_file:
#      - .env
#    ports:
#      - "5000:80"
#    volumes:
#      - pg_admin:/var/lib/pgadmin
#    depends_on:
#      - postgres

  nginx:
    image: nginx:1.19
    volumes:
      - staticfiles_content:/wms/src/staticfiles
      - media_content:/wms/src/media
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
#  pg_data: { }
#  pg_admin: { }
  staticfiles_content: { }
  media_content: { }
